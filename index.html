<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Cats</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <header>
        <h1>HTTP Cats</h1>
        <p>Explore HTTP status codes with cats.</p>
    </header>

    <main>

        <section class="category-section">

            <h2>Explore Status Codes</h2>

            <form>

                <label for="category">Choose a category:</label>

                <select id="category">
                    <option value="">Select a category</option>
                    <option value="1xx">1xx - Informational</option>
                    <option value="2xx">2xx - Success</option>
                    <option value="3xx">3xx - Redirection</option>
                    <option value="4xx">4xx - Client Error</option>
                    <option value="5xx">5xx - Server Error</option>
                </select>

                <button type="submit">Search</button>

            </form>

        </section>


        <section class="status-results">

            <h2>Status Codes</h2>

            <!-- JavaScript will display status codes here -->

        </section>


        <section class="status-details">

            <h2>Status Details</h2>

            <!-- JavaScript will display the selected status here -->

        </section>

    </main>

    <footer>
        <p>HTTP Cats Explorer</p>
    </footer>

    <script src="./script.js"></script>

</body>
</html>
